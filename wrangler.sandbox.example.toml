# Copy to work/wrangler.toml OUTSIDE the static publish directory, then replace
# database_id. This is a template, not active Pages deployment configuration.
name = "actua-website-sandbox"
compatibility_date = "2026-11-17"
pages_build_output_dir = "../actua-website"

[vars]
PADDLE_ENVIRONMENT = "sandbox"
SUPPORTER_SANDBOX_ENABLED = "false"
SUPPORTER_SIGNING_KEY_ID = "sandbox-1"

[[d1_databases]]
binding = "SUPPORTER_DB"
database_name = "actua-supporter-sandbox"
database_id = "REPLACE_WITH_SANDBOX_D1_ID"
migrations_dir = "../actua-website/migrations"

# Add these to [vars] in the real preview configuration, not under d1_databases:
# SUPPORTER_SANDBOX_CHECKOUT_ENABLED = "false"
# SUPPORTER_SANDBOX_ORIGIN = "https://YOUR-SANDBOX-PREVIEW.pages.dev"
# PADDLE_SANDBOX_CLIENT_TOKEN = "test_REPLACE_WITH_PUBLIC_SANDBOX_TOKEN"
# TURNSTILE_SITE_KEY = "REPLACE_WITH_PUBLIC_SITE_KEY"
# Encrypted Pages secrets only: PADDLE_SANDBOX_API_KEY, TURNSTILE_SECRET_KEY
# SUPPORTER_SANDBOX_RECOVERY_ENABLED = "false"
# SUPPORTER_EMAIL_FROM = "Actua <support@notify.azimulkabir.com>"
# Additional encrypted Pages secrets: RESEND_API_KEY,
# SUPPORTER_RECOVERY_ENCRYPTION_KEY, SUPPORTER_RECOVERY_JOB_TOKEN
