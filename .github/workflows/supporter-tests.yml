name: Supporter backend tests
on:
  pull_request:
    paths:
      - 'functions/**'
      - 'migrations/**'
      - 'ops/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/supporter-tests.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'migrations/**'
      - 'ops/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/supporter-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
