name: Update legal pages

# Checks periodically for changes to PRIVACY.md and TERMS.md in azimul-kabir/actua,
# regenerates privacy.html and terms.html, and commits any changes to main.
# Cloudflare Pages deploys the commit like any other push to main.
# The actua repository can also send a repository_dispatch event of type
# "privacy-updated" or "app-released" to update immediately.

on:
  schedule:
    - cron: '15 */4 * * *'
  repository_dispatch:
    types: [privacy-updated, app-released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: privacy-policy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update privacy.html and terms.html from azimul-kabir/actua
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-legal.mjs

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privacy.html terms.html
          git commit -m "Update legal pages from azimul-kabir/actua"
          # Another workflow can push to main between our pull and our push, which
          # makes the push fail with "cannot lock ref". Pull again and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push to main after 5 attempts" >&2
          exit 1
