# Copy to /workspace/work/recovery-worker.toml outside the static publish root.
# Deploy independently only after sandbox Pages secrets and migrations are ready.
name = "actua-sandbox-recovery-dispatch"
main = "../actua-website/ops/recovery-dispatch.js"
compatibility_date = "2026-11-17"

[triggers]
crons = ["* * * * *"]

[vars]
SUPPORTER_RECOVERY_ENDPOINT = "https://YOUR-SANDBOX-PREVIEW.pages.dev/api/supporter/recovery/process"
# Encrypted Worker secret: SUPPORTER_RECOVERY_JOB_TOKEN (same as Pages secret)
